<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090B" />
    <title>Tailflow — Fleet Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      No-FOUC theme bootstrap. Runs before React hydrates so the correct
      theme is applied on the first paint. Mirrors the logic in lib/theme.ts:
      read stored mode (default "system"), resolve against OS preference,
      set data-theme on <html>. Must stay in sync with STORAGE_KEY there.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("tailflow.theme");
          if (mode !== "dark" && mode !== "light" && mode !== "system") mode = "system";
          var resolved =
            mode === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          document.documentElement.setAttribute("data-theme", resolved);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", resolved === "dark" ? "#09090B" : "#FAFAF8");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
