name: CI

on:
  push:
    branches: [main, v1-rewrite]
  pull_request:
    branches: [main, v1-rewrite]
  # Nightly runs the slow suites (integration, e2e, load) per design §18.6.
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Go + Web + OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Install spectral
        run: npm install -g @stoplight/spectral-cli
      - name: golangci-lint
        run: golangci-lint run ./...
      - name: web lint + typecheck
        run: |
          cd web && npm ci && npm run lint && npm run typecheck
      - name: spectral lint openapi
        run: spectral lint api/openapi.yaml

  go-test:
    name: Go tests (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race -coverprofile
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: Enforce coverage floor on critical packages
        run: |
          # Design §8.3: state, collector, hub coverage floor 80%.
          # In M0 only config, fakesource, hub, api exist; enforce a softer
          # 70% floor until the M1 packages land.
          go tool cover -func=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  web-test:
    name: Web tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: vitest run
        run: cd web && npm ci && npm run test -- --run

  contract:
    name: Contract (generated code up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install codegen tools
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
          npm install -g openapi-typescript
      - name: Regenerate and diff
        run: make codegen
      - name: Verify no diff
        run: |
          if ! git diff --exit-code -- internal/api/ web/src/lib/api/; then
            echo ""
            echo "ERROR: generated code is out of date. Run 'make codegen' and commit the result."
            exit 1
          fi

  integration:
    name: Integration (real tailkitd, Docker Compose)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: make web
        run: make web
      - name: make build
        run: make build
      - name: docker compose up (compose.test.yml)
        run: |
          docker compose -f deploy/compose.test.yml up --abort-on-container-exit --exit-code-from tailflow
      - name: go test -tags integration
        run: go test -tags integration ./...

  e2e:
    name: End-to-end (Playwright against fakesource)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build with -tags e2e
        run: |
          make web
          CGO_ENABLED=0 go build -tags e2e -o bin/tailflow-e2e ./cmd/tailflow
      - name: Playwright
        run: cd web && npm ci && npx playwright install --with-deps && npm run e2e

  load:
    name: Load (200 hosts, 30 min)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: scripts/loadgen
        run: go run ./scripts/loadgen --duration 30m
